<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prancha — Segura Firme</title>
<style>
  :root {
    --bg: #EAF4FC;
    --panel: #FFFFFF;
    --panel-edge: #CFE4F5;
    --ink: #0B3A5C;
    --ink-dim: #6D93B3;
    --ember: #1E9FDB;
    --ember-dim: #0B6FA6;
    --chalk: #6FD0FF;
    --success: #0B6FA6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 32px 28px 28px;
    position: relative;
    overflow: hidden;
  }

  .app::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--ember), var(--chalk));
  }

  .eyebrow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
  }

  .eyebrow h1 {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0;
    color: var(--ink);
  }

  .best {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-align: right;
  }

  .best strong {
    display: block;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 15px;
    color: var(--chalk);
    letter-spacing: 0;
    margin-top: 2px;
  }

  .goal-row {
    margin-bottom: 20px;
    transition: opacity 0.2s ease;
  }

  .goal-row.disabled {
    opacity: 0.45;
    pointer-events: none;
  }

  .goal-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .chip {
    font-family: inherit;
    border: 1px solid var(--panel-edge);
    background: transparent;
    color: var(--ink-dim);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .chip:hover { color: var(--ink); border-color: var(--ink-dim); }

  .chip.active {
    background: var(--ember);
    border-color: var(--ember);
    color: #FFFFFF;
  }

  .custom-goal input {
    width: 100%;
    font-family: inherit;
    background: var(--bg);
    border: 1px solid var(--panel-edge);
    color: var(--ink);
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 7px;
    outline: none;
  }

  .custom-goal input:focus { border-color: var(--ink-dim); }

  .custom-goal input::placeholder { color: var(--ink-dim); }

  .ring-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring-wrap.goal-hit .ring-fg { stroke: var(--success); }

  .ring-wrap.goal-hit::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(11, 111, 166, 0.55);
    animation: pulseOutGoal 0.9s ease-out;
  }

  @keyframes pulseOutGoal {
    0%   { box-shadow: 0 0 0 0 rgba(11, 111, 166, 0.55); }
    100% { box-shadow: 0 0 0 26px rgba(11, 111, 166, 0); }
  }

  svg.ring { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }

  .ring-bg {
    fill: none;
    stroke: var(--panel-edge);
    stroke-width: 6;
  }

  .ring-fg {
    fill: none;
    stroke: var(--ember);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke 0.3s ease;
  }

  .ring-tick {
    fill: var(--ink-dim);
    transform: rotate(90deg);
    transform-origin: 120px 120px;
  }

  .ring-wrap.pulse .ring-fg {
    stroke: var(--chalk);
  }

  .ring-wrap.pulse::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(111, 208, 255, 0.6);
    animation: pulseOut 0.6s ease-out;
  }

  @keyframes pulseOut {
    0%   { box-shadow: 0 0 0 0 rgba(111, 208, 255, 0.55); }
    100% { box-shadow: 0 0 0 18px rgba(111, 208, 255, 0); }
  }

  .time {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .time .digits {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 44px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }

  .time .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    border-radius: 9px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 13px;
    padding: 14px 10px;
    transition: filter 0.15s ease, transform 0.1s ease;
  }

  button:active { transform: scale(0.97); }

  .btn-primary {
    flex: 2;
    background: var(--ember);
    color: #FFFFFF;
  }

  .btn-primary:hover { filter: brightness(1.08); }

  .btn-secondary {
    flex: 1;
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
  }

  .btn-secondary:hover { color: var(--ink); border-color: var(--ink-dim); }

  .btn-mute {
    flex: 0 0 auto;
    width: 48px;
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    font-size: 16px;
    padding: 14px 0;
  }

  .btn-mute:hover { color: var(--ink); border-color: var(--ink-dim); }

  .record-flash {
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--success);
    margin-top: 14px;
    height: 14px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .record-flash.show { opacity: 1; }

  .goal-flash {
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--success);
    margin-top: 6px;
    height: 18px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .goal-flash.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .ring-fg, button, .record-flash { transition: none !important; }
    .ring-wrap.pulse::after { animation: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="eyebrow">
    <h1>Prancha</h1>
    <div class="best">Recorde<strong id="bestTime">00:00</strong></div>
  </div>

  <div class="goal-row" id="goalRow">
    <div class="goal-label">Meta de tempo</div>
    <div class="chips" id="chips">
      <button class="chip" data-goal="15">15s</button>
      <button class="chip" data-goal="20">20s</button>
      <button class="chip active" data-goal="30">30s</button>
      <button class="chip" data-goal="45">45s</button>
      <button class="chip" data-goal="60">60s</button>
      <button class="chip" data-goal="0">Livre</button>
    </div>
    <div class="custom-goal">
      <input type="number" id="customGoal" min="5" max="600" step="5" placeholder="outro (seg)">
    </div>
  </div>

  <div class="ring-wrap" id="ringWrap">
    <svg class="ring" width="240" height="240" viewBox="0 0 240 240">
      <circle class="ring-bg" cx="120" cy="120" r="108"></circle>
      <circle class="ring-fg" id="ringFg" cx="120" cy="120" r="108"
              stroke-dasharray="678.6" stroke-dashoffset="678.6"></circle>
    </svg>
    <div class="time">
      <div class="digits" id="digits">00:00</div>
      <div class="label" id="timeLabel">meta: 30s</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-primary" id="startBtn">Começar</button>
    <button class="btn-secondary" id="resetBtn">Zerar</button>
    <button class="btn-mute" id="muteBtn" title="Ativar ou silenciar a voz">🔊</button>
  </div>

  <div class="record-flash" id="recordFlash">Novo recorde!</div>
  <div class="goal-flash" id="goalFlash">Meta concluída!</div>
</div>

<script>
(function () {
  const digitsEl = document.getElementById('digits');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const muteBtn = document.getElementById('muteBtn');
  const ringFg = document.getElementById('ringFg');
  const ringWrap = document.getElementById('ringWrap');
  const bestTimeEl = document.getElementById('bestTime');
  const recordFlash = document.getElementById('recordFlash');
  const goalFlash = document.getElementById('goalFlash');
  const goalRow = document.getElementById('goalRow');
  const chips = document.getElementById('chips');
  const customGoalInput = document.getElementById('customGoal');
  const timeLabel = document.getElementById('timeLabel');

  const CIRC = 2 * Math.PI * 108;
  ringFg.setAttribute('stroke-dasharray', CIRC.toFixed(1));

  let running = false;
  let startedAt = null;
  let elapsedBeforePause = 0;
  let intervalId = null;
  let muted = false;
  let bestMs = 0;
  let goalMs = 30000;
  let goalReached = false;

  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function pulseRing() {
    ringWrap.classList.remove('pulse');
    void ringWrap.offsetWidth;
    ringWrap.classList.add('pulse');
    setTimeout(() => ringWrap.classList.remove('pulse'), 620);
  }

  let audioCtx = null;
  let beatTimeoutId = null;
  let lastBeatInterval = null;
  const BEAT_START_INTERVAL = 1500;
  const BEAT_MID_INTERVAL = 500;
  const BEAT_END_INTERVAL = 70;
  const FINAL_WINDOW_MS = 14000;
  const CURVE_POWER_EARLY = 1.3;
  const CURVE_POWER_LATE = 2.5;
  const FREE_MODE_INTERVAL = 750;

  function ensureAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playBeat(progress) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420 + progress * 420, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  function scheduleNextBeat() {
    if (!running) return;
    const elapsed = elapsedBeforePause + (Date.now() - startedAt);

    let baseInterval;
    let pitchProgress;

    if (goalMs > 0) {
      const remaining = Math.max(goalMs - elapsed, 0);
      pitchProgress = Math.min(elapsed / goalMs, 1);

      if (remaining > FINAL_WINDOW_MS) {
        const rampDuration = Math.max(goalMs - FINAL_WINDOW_MS, 1);
        const p = Math.min(elapsed / rampDuration, 1);
        baseInterval = BEAT_START_INTERVAL - (BEAT_START_INTERVAL - BEAT_MID_INTERVAL) * Math.pow(p, CURVE_POWER_EARLY);
      } else {
        const p2 = (FINAL_WINDOW_MS - remaining) / FINAL_WINDOW_MS;
        baseInterval = BEAT_MID_INTERVAL - (BEAT_MID_INTERVAL - BEAT_END_INTERVAL) * Math.pow(p2, CURVE_POWER_LATE);
      }
    } else {
      baseInterval = FREE_MODE_INTERVAL;
      pitchProgress = 0;
    }

    let interval = baseInterval;
    if (goalMs > 0 && lastBeatInterval !== null && interval >= lastBeatInterval) {
      interval = lastBeatInterval - 1;
    }
    interval = Math.max(interval, BEAT_END_INTERVAL - 20);
    lastBeatInterval = interval;

    playBeat(pitchProgress);
    pulseRing();
    beatTimeoutId = setTimeout(scheduleNextBeat, interval);
  }

  function stopBeat() {
    clearTimeout(beatTimeoutId);
    beatTimeoutId = null;
    lastBeatInterval = null;
  }

  function tick() {
    const elapsed = elapsedBeforePause + (Date.now() - startedAt);
    digitsEl.textContent = formatTime(elapsed);

    if (goalMs > 0 && !goalReached && elapsed >= goalMs) {
      goalReached = true;
      stopBeat();
      ringFg.setAttribute('stroke-dashoffset', '0');
      ringWrap.classList.add('goal-hit');
      goalFlash.classList.add('show');
      setTimeout(() => goalFlash.classList.remove('show'), 2400);
      pause();
      return;
    }

    if (goalMs > 0) {
      const progress = Math.min(elapsed / goalMs, 1);
      ringFg.setAttribute('stroke-dashoffset', (CIRC * (1 - progress)).toFixed(1));
    } else {
      const cycleProgress = (elapsed % 10000) / 10000;
      ringFg.setAttribute('stroke-dashoffset', (CIRC * (1 - cycleProgress)).toFixed(1));
    }
  }

  function start() {
    running = true;
    startedAt = Date.now();
    startBtn.textContent = 'Pausar';
    goalRow.classList.add('disabled');
    intervalId = setInterval(tick, 100);
    ensureAudioCtx();
    scheduleNextBeat();
  }

  function pause() {
    running = false;
    clearInterval(intervalId);
    stopBeat();
    elapsedBeforePause += Date.now() - startedAt;
    startBtn.textContent = 'Continuar';
    goalRow.classList.remove('disabled');
    checkBest(elapsedBeforePause);
  }

  function reset() {
    running = false;
    clearInterval(intervalId);
    stopBeat();
    checkBest(elapsedBeforePause + (startedAt ? Date.now() - startedAt : 0));
    elapsedBeforePause = 0;
    startedAt = null;
    goalReached = false;
    ringWrap.classList.remove('goal-hit');
    goalRow.classList.remove('disabled');
    digitsEl.textContent = '00:00';
    ringFg.setAttribute('stroke-dashoffset', CIRC.toFixed(1));
    startBtn.textContent = 'Começar';
    window.speechSynthesis && window.speechSynthesis.cancel();
  }

  async function checkBest(ms) {
    if (ms <= bestMs) return;
    bestMs = ms;
    bestTimeEl.textContent = formatTime(bestMs);
    recordFlash.classList.add('show');
    setTimeout(() => recordFlash.classList.remove('show'), 1800);
    try {
      await window.storage.set('plank-best-ms', String(bestMs), false);
    } catch (e) {
      console.error('Não foi possível salvar o recorde:', e);
    }
  }

  async function loadBest() {
    try {
      const result = await window.storage.get('plank-best-ms', false);
      if (result && result.value) {
        bestMs = parseInt(result.value, 10) || 0;
        bestTimeEl.textContent = formatTime(bestMs);
      }
    } catch (e) {
      // sem recorde salvo ainda
    }
  }

  function updateTimeLabel() {
    timeLabel.textContent = goalMs > 0 ? ('meta: ' + Math.round(goalMs / 1000) + 's') : 'tempo livre';
  }

  function applyGoal(seconds) {
    goalMs = seconds > 0 ? seconds * 1000 : 0;
    goalReached = false;
    ringWrap.classList.remove('goal-hit');
    updateTimeLabel();
    if (!running && elapsedBeforePause === 0) {
      ringFg.setAttribute('stroke-dashoffset', CIRC.toFixed(1));
    }
  }

  chips.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    [...chips.querySelectorAll('.chip')].forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    customGoalInput.value = '';
    applyGoal(parseInt(btn.dataset.goal, 10));
  });

  customGoalInput.addEventListener('input', () => {
    const val = parseInt(customGoalInput.value, 10);
    if (!val || val <= 0) return;
    [...chips.querySelectorAll('.chip')].forEach(c => c.classList.remove('active'));
    applyGoal(val);
  });

  updateTimeLabel();

  startBtn.addEventListener('click', () => {
    if (!running) {
      start();
    } else {
      pause();
    }
  });

  resetBtn.addEventListener('click', reset);

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (muted && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  });
  // A batida sonora (playBeat) já verifica a variável "muted" a cada disparo.

  loadBest();
})();
</script>

</body>
</html>
